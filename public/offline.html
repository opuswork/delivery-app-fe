<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1b3358" />
    <title>오프라인 | 말로일정</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        box-sizing: border-box;
        background: #1b3358;
        color: #fff;
        font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
        text-align: center;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 0; font-size: 1.75rem; }
      p { margin: 0; color: #cbd5e1; line-height: 1.6; }
      button {
        margin-top: 8px;
        border: 0;
        border-radius: 14px;
        padding: 14px 28px;
        background: #3f76db;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>인터넷 연결을 확인해 주세요</h1>
    <p>말로일정은 배달 정보를 저장하려면<br />인터넷 연결이 필요합니다.</p>
    <button type="button" onclick="location.reload()">다시 시도</button>
  </body>
</html>
